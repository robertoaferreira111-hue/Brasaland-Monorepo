[project]
name = "brasaland-supplier-api"
version = "0.1.0"
description = "Brasaland supplier directory TinyDB storage API"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "tinydb>=4",
    "uvicorn>=0.32",
]

[project.scripts]
seed = "app.seed:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
