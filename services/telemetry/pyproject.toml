[project]
name = "brasaland-telemetry"
version = "0.1.0"
description = "Brasaland telemetry analysis pipeline (Pandas + Supabase reads)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
default-groups = ["dev"]
package = false
