<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Register</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../index.html">Brasaland</a>
      </div>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Register</h1>
        <p>Create a staff account, then continue to the supplier directory.</p>
      </header>
      <section class="panel">
        <form id="register-form" class="register-form" novalidate>
          <label>
            Email
            <input name="email" type="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" required />
          </label>
          <div class="form-actions">
            <button type="submit">Create account</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p>Already registered? <a id="login-link" href="../login/">Sign in</a></p>
      </section>
    </main>
    <script src="../js/telemetry.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/register-page.js"></script>
  </body>
</html>
