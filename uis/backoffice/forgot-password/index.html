<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Forgot password</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../index.html">Brasaland</a>
      </div>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Forgot password</h1>
        <p>
          Enter your account email. If it is registered, we will send a reset
          link.
        </p>
      </header>
      <section class="panel">
        <form id="forgot-form" class="register-form" novalidate>
          <label>
            Email
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </label>
          <div class="form-actions">
            <button id="forgot-submit" type="submit">Send reset link</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p id="form-success" class="message message-success" role="status" hidden></p>
        <p><a id="login-link" href="../login/">Back to sign in</a></p>
      </section>
    </main>
    <script src="../js/session.js"></script>
    <script src="../js/forgot-password-page.js"></script>
  </body>
</html>
