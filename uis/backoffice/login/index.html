<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Sign in</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../index.html">Brasaland</a>
      </div>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Sign in</h1>
        <p>Staff access for the supplier directory and your account profile.</p>
      </header>
      <section class="panel">
        <form id="login-form" class="register-form" novalidate>
          <label>
            Email
            <input name="email" type="email" autocomplete="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <div class="form-actions">
            <button type="submit">Sign in</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p>
          <a id="forgot-link" href="../forgot-password/">Forgot your password?</a>
        </p>
        <p>No account yet? <a id="register-link" href="../register/">Register</a></p>
      </section>
    </main>
    <script src="../js/session.js"></script>
    <script src="../js/login-page.js"></script>
  </body>
</html>
