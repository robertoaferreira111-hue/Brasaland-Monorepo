<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Reset password</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../index.html">Brasaland</a>
      </div>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Reset password</h1>
        <p>Choose a new password for your Brasaland account.</p>
      </header>
      <section class="panel">
        <div id="missing-token" hidden>
          <p>
            This reset link is missing a token.
            <a id="forgot-link-missing" href="../forgot-password/">Request a new reset link</a>
          </p>
        </div>
        <form id="reset-form" class="register-form" novalidate>
          <label>
            New password
            <input
              id="new_password"
              name="new_password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="password-error" class="field-error" aria-live="polite"></p>
          <label>
            Confirm new password
            <input
              id="confirm_password"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="confirm-error" class="field-error" aria-live="polite"></p>
          <div class="form-actions">
            <button id="reset-submit" type="submit">Reset password</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p id="form-success" class="message message-success" role="status" hidden></p>
        <p>
          <a id="forgot-link" href="../forgot-password/">Forgot your password?</a>
          ·
          <a id="login-link" href="../login/">Back to sign in</a>
        </p>
      </section>
    </main>
    <script src="../js/session.js"></script>
    <script src="../js/reset-password-page.js"></script>
  </body>
</html>
