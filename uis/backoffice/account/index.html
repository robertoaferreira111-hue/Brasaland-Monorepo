<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Account</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../index.html">Brasaland</a>
        <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Open navigation
        </button>
      </div>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a id="directory-link" href="../index.html">Supplier directory</a>
        <a href="index.html" aria-current="page">Account</a>
        <button id="logout" class="nav-logout" type="button">Log out</button>
      </nav>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Account</h1>
        <p>Your email stays on the account. Update the name, phone, and address procurement can use.</p>
      </header>
      <p id="page-status" class="status-line" role="status">Checking session…</p>
      <section class="panel">
        <form id="profile-form" class="register-form" hidden novalidate>
          <label>
            Email
            <input id="profile-email" name="email" readonly />
          </label>
          <label>
            Name
            <input name="name" autocomplete="name" required />
          </label>
          <label>
            Phone
            <input name="phone" autocomplete="tel" required />
          </label>
          <label>
            Address
            <input name="address" autocomplete="street-address" required />
          </label>
          <div class="form-actions">
            <button type="submit">Save profile</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p id="form-success" class="message message-success" role="status" hidden></p>
      </section>
    </main>
    <script src="../js/session.js"></script>
    <script src="../js/account-page.js"></script>
  </body>
</html>
