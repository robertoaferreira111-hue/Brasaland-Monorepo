<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brasaland | Change password</title>
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-bar">
        <a class="brand" href="../../index.html">Brasaland</a>
        <button
          id="nav-toggle"
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          Open navigation
        </button>
      </div>
      <nav id="site-nav" class="site-nav" aria-label="Primary">
        <a id="directory-link" href="../../index.html">Supplier directory</a>
        <a id="account-link" href="../profile/">Account</a>
        <a href="./" aria-current="page">Change password</a>
        <button id="logout" class="nav-logout" type="button">Log out</button>
      </nav>
    </header>
    <main id="main" class="auth-main" tabindex="-1">
      <header class="page-intro">
        <h1>Change password</h1>
        <p>Update your password while signed in to the backoffice.</p>
      </header>
      <section class="panel">
        <form id="change-form" class="register-form" novalidate>
          <label>
            Current password
            <input
              id="current_password"
              name="current_password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <p id="current-error" class="field-error" aria-live="polite"></p>
          <label>
            New password
            <input
              id="new_password"
              name="new_password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="password-error" class="field-error" aria-live="polite"></p>
          <label>
            Confirm new password
            <input
              id="confirm_password"
              name="confirm_password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </label>
          <p id="confirm-error" class="field-error" aria-live="polite"></p>
          <div class="form-actions">
            <button id="change-submit" type="submit">Update password</button>
          </div>
        </form>
        <p id="form-error" class="message message-error" role="alert" hidden></p>
        <p id="form-success" class="message message-success" role="status" hidden></p>
      </section>
    </main>
    <script src="../../js/session.js"></script>
    <script src="../../js/change-password-page.js"></script>
  </body>
</html>
