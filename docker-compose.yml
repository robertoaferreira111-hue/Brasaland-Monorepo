name: brasaland

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: development
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    env_file:
      - .env
    environment:
      BRASALAND_ROOT: /opt/brasaland
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./services/api:/app
      - api-venv:/app/.venv
      - ./services/reporting:/opt/brasaland/services/reporting
      - ./services/telemetry:/opt/brasaland/services/telemetry
      - ./data/pipelines:/opt/brasaland/data/pipelines
      - ./data/process:/opt/brasaland/data/process
    networks:
      - brasaland-net
    restart: unless-stopped

  website:
    build:
      context: ./uis/website
      target: development
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
    volumes:
      - ./uis/website:/app
      - website-node-modules:/app/node_modules
      - website-next:/app/.next
    depends_on:
      - api
    networks:
      - brasaland-net
    restart: unless-stopped

  backoffice:
    build:
      context: ./uis/backoffice
      target: development
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "${BACKOFFICE_PORT:-3001}:3001"
    volumes:
      - ./uis/backoffice:/app
      - backoffice-node-modules:/app/node_modules
      - backoffice-next:/app/.next
    depends_on:
      - api
    networks:
      - brasaland-net
    restart: unless-stopped

  talent:
    build:
      context: ./uis/talent-pipeline-tracker
      target: development
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000}"
    ports:
      - "${TALENT_PORT:-3002}:3002"
    volumes:
      - ./uis/talent-pipeline-tracker:/app
      - talent-node-modules:/app/node_modules
      - talent-next:/app/.next
    depends_on:
      - api
    networks:
      - brasaland-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - brasaland-net
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brasaland-net
    restart: unless-stopped

volumes:
  api-venv:
  website-node-modules:
  website-next:
  backoffice-node-modules:
  backoffice-next:
  talent-node-modules:
  talent-next:
  redis-data:

networks:
  brasaland-net:
    name: brasaland-net
    driver: bridge
